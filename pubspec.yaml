name: dompet_saku_harian
description: "Aplikasi pencatat keuangan harian."
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Menambahkan paket ikon Google Fonts & Cupertino Icons
  cupertino_icons: ^1.0.6

flutter:
  uses-material-design: true
  # Mendaftarkan Font Google Poppins (Simulasi aset lokal jika nanti diunduh)
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
