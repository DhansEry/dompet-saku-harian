name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # 1. Pindahkan ke nama folder valid agar flutter create berjalan mulus
      - name: Perbaiki Penamaan Folder Proyek
        run: |
          mkdir ../dompet_saku_harian
          cp -r ./* ../dompet_saku_harian/
          
      # 2. Regenerasi folder android secara utuh di server
      - name: Regenerasi Folder Android Terbaru
        run: |
          cd ../dompet_saku_harian
          flutter create --platforms=android .

      # 3. Ubah nama aplikasi menjadi nama formal ber-spasi di AndroidManifest
      - name: Ganti Nama Aplikasi Resmi
        run: |
          cd ../dompet_saku_harian
          sed -i 's/android:label=".*"/android:label="Dompet Saku Harian"/' android/app/src/main/AndroidManifest.xml

      # 4. Pasang library launcher icons dan build logonya khusus untuk Android saja
      - name: Generate Logo Aplikasi Baru
        run: |
          cd ../dompet_saku_harian
          flutter pub add --dev flutter_launcher_icons
          cat <<INNER_EOF > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "assets/icon/app_icon.png"
            min_sdk_android: 21
          INNER_EOF
          flutter pub run flutter_launcher_icons

      - name: Ambil Dependencies (Library)
        run: |
          cd ../dompet_saku_harian
          flutter pub get

      - name: Kompilasi Aplikasi Menjadi APK
        run: |
          cd ../dompet_saku_harian
          flutter build apk --release

      - name: Amankan File APK ke Folder Utama
        run: cp ../dompet_saku_harian/build/app/outputs/flutter-apk/app-release.apk ./app-release.apk

      - name: Upload File APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Dompet-Saku-Harian-Release-APK
          path: app-release.apk
