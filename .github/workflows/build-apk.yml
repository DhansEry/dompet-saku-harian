name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Perbaiki Penamaan Folder Proyek
        run: |
          mkdir ../dompet_saku_harian
          cp -r ./* ../dompet_saku_harian/
          cd ../dompet_saku_harian
          
      - name: Regenerasi Folder Android Terbaru
        run: |
          cd ../dompet_saku_harian
          flutter create --platforms=android .

      - name: Ambil Dependencies (Library)
        run: |
          cd ../dompet_saku_harian
          flutter pub get

      - name: Kompilasi Aplikasi Menjadi APK
        run: |
          cd ../dompet_saku_harian
          flutter build apk --release

      # Perbaikan: Kita salin dulu file APK-nya ke folder utama proyek saat ini, 
      # baru kita upload tanpa menggunakan path ".."
      - name: Amankan File APK ke Folder Utama
        run: cp ../dompet_saku_harian/build/app/outputs/flutter-apk/app-release.apk ./app-release.apk

      - name: Upload File APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Dompet-Saku-Harian-Release-APK
          path: app-release.apk
